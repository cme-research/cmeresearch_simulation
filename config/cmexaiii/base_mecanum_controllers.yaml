controller_manager:
  ros__parameters:
    update_rate: 50  # Hz – higher rate for smoother simulation

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    base_mecanum_controller:
      type: mecanum_drive_controller/MecanumDriveController


base_mecanum_controller:
  ros__parameters:
    front_left_wheel_command_joint_name:  "front_left_wheel_joint"
    front_right_wheel_command_joint_name: "front_right_wheel_joint"
    rear_left_wheel_command_joint_name:   "rear_left_wheel_joint"
    rear_right_wheel_command_joint_name:  "rear_right_wheel_joint"

    kinematics:
      base_frame_offset: { x: 0.0, y: 0.0, theta: 0.0 }
      wheels_radius: 0.05
      # (wheelbase/2 + track/2) = (0.150 + 0.177) = 0.327
      sum_of_robot_center_projection_on_X_Y_axis: 0.327

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal:  [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: false
    position_feedback: true
    enable_odom_tf: true

    cmd_vel_timeout: 0.5

    linear.x.has_velocity_limits:     true
    linear.x.has_acceleration_limits: true
    linear.x.has_jerk_limits:         false
    linear.x.max_velocity:            1.0
    linear.x.min_velocity:           -1.0
    linear.x.max_acceleration:        1.0

    linear.y.has_velocity_limits:     true
    linear.y.has_acceleration_limits: true
    linear.y.has_jerk_limits:         false
    linear.y.max_velocity:            1.0
    linear.y.min_velocity:           -1.0
    linear.y.max_acceleration:        1.0

    angular.z.has_velocity_limits:     true
    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits:         false
    angular.z.max_velocity:            8.0
    angular.z.min_velocity:           -8.0
    angular.z.max_acceleration:        1.0
    angular.z.min_acceleration:       -1.0
