twist_mux:
  ros__parameters:
    # Velocity arbitration for simulation.
    # Output is remapped to /base_mecanum_controller/reference in the launch file.
    # MecanumDriveController in ros2_control jazzy expects TwistStamped on /reference.
    use_stamped: true
    topics:
      navigation:
        topic:    /cmd_vel
        timeout:  0.5
        priority: 10
      teleop:
        topic:    /teleop/cmd_vel
        timeout:  0.5
        priority: 100
      mqtt:
        topic:    /mqtt/cmd_vel
        timeout:  0.5
        priority: 80
