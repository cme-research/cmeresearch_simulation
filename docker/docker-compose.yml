# CMEXAIII Webots Simulation – Docker Compose
#
# Build the image first (from ros2_ws/ root):
#   docker build -f src/cmeresearch_simulation/docker/Dockerfile \
#                -t cmeresearch/simulation:latest .
#
# Profiles
# --------
#   base          Webots + robot driver + ros2_control only
#   full          base + SLAM + Nav2 + state machine + mqtt_bridge
#   webapp        full + local mosquitto broker + production webapp container
#   rviz          adds an RViz2 window (requires display)
#
# Quick start (full stack, with GUI):
#   xhost +local:docker
#   docker compose -f src/cmeresearch_simulation/docker/docker-compose.yml \
#     --profile full up
#
# End-to-end webapp test (controller → mqtt_bridge → broker → webapp → broker → bridge → ROS):
#   xhost +local:docker
#   docker compose -f src/cmeresearch_simulation/docker/docker-compose.yml \
#     --profile webapp up
#   Open http://localhost:8000 to drive the simulated robot from the webapp.
#
# Headless (no display – Xvfb auto-started inside containers):
#   docker compose -f src/cmeresearch_simulation/docker/docker-compose.yml \
#     --profile full up
#
# Base sim only:
#   docker compose ... --profile base up
#
# With RViz:
#   xhost +local:docker
#   docker compose ... --profile full --profile rviz up

x-ros-common: &ros-common
  image: cmeresearch/simulation:latest
  network_mode: host          # ROS 2 DDS discovery works across containers
  ipc: host                   # shared memory transport (FastDDS / CycloneDDS)
  environment:
    - DISPLAY=${DISPLAY:-}    # empty → entrypoint starts Xvfb automatically
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix   # no-op if DISPLAY is unset

services:

  # ── Local MQTT broker ────────────────────────────────────────────────────
  # Mirrors the prod-deploy broker so the webapp + mqtt_bridge chain can be
  # exercised end-to-end without the real robot. No remote-bridge connection;
  # everything stays on localhost.
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: cmexaiii_sim_mosquitto
    profiles: [webapp]
    network_mode: host
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      # Probe via the container's own non-loopback IP so a misconfigured
      # loopback-only listener fails the check (same approach as cmexa_install
      # production compose).
      test: ["CMD-SHELL", "mosquitto_sub -h \"$$(hostname -i | awk '{print $$1}')\" -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: on-failure

  # ── Webapp (same image used in production) ───────────────────────────────
  # Connects to localhost:1883 (host network) and to the topics in its
  # baked-in app_config.json (cmeresearch/cmexaiii-001/...). The sim's
  # mqtt_bridge_sim_params.yaml uses the matching namespace so topics line up.
  webapp:
    image: ghcr.io/cme-research/cmeresearch_amr_webcontrol:${WEBAPP_VERSION:-jazzy-latest}
    container_name: cmexaiii_sim_webapp
    profiles: [webapp]
    network_mode: host
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: on-failure

  # ── Base simulation (Webots + ros2_control) ──────────────────────────────
  webots_sim:
    <<: *ros-common
    profiles: [base, full, webapp]
    container_name: cmexaiii_webots
    command: >
      ros2 launch cmeresearch_simulation cmexaiii_webots.launch.py
        gui:=${WEBOTS_GUI:-true}
        use_sim_time:=true
    restart: on-failure

  # ── Navigation stack (laser merger + twist_mux + SLAM + Nav2 + state machine
  #     + mqtt_bridge + joint_states→wheel_feedback adapter) ───────────────
  nav_stack:
    <<: *ros-common
    profiles: [full, webapp]
    container_name: cmexaiii_nav_stack
    # startup_delay gives Webots time to publish TF and laser topics before
    # the nav stack tries to subscribe.
    command: >
      ros2 launch cmeresearch_simulation cmexaiii_nav_stack.launch.py
        startup_delay:=${NAV_STARTUP_DELAY:-10.0}
    depends_on:
      - webots_sim
    restart: on-failure

  # ── Optional RViz2 ────────────────────────────────────────────────────────
  rviz:
    <<: *ros-common
    profiles: [rviz]
    container_name: cmexaiii_rviz
    command: >
      ros2 run rviz2 rviz2
        -d /ros2_ws/install/cmeresearch_bringup/share/cmeresearch_bringup/rviz/cmexaiii.rviz
    depends_on:
      - webots_sim
    restart: on-failure
